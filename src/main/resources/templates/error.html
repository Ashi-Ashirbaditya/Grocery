<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <style>

        body {
           margin: 0;
           padding: 0;
           font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
           background-color: #1e063f;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           color: #333;
       }

       .container {
           text-align: center;
           max-width: 600px;
           padding: 2rem;
       }

       .error-code {
           font-size: 8rem;
           font-weight: bold;
           color: #6bff7c;
       }

       .message {
           font-size: 1.5rem;
           margin-bottom: 1.5rem;
       }

       a {
           text-decoration: none;
           color: #007bff;
           font-weight: bold;
           transition: color 0.2s ease;
       }

       a:hover {
           color: #0056b3;
       }

       .emoji {
           font-size: 3rem;
           margin-bottom: 1rem;
       }

    </style>
</head>
<body>
<div class="container">
    <div class="error-code">404</div>
    <div class="message">Oops! The page you're looking for doesn't exist.</div>
    <a href="/">Home</a>
</div>
</body>
</html>
